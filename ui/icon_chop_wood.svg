<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- 森で木を切る：切り株に刺さったオノ＋小さな木 -->
  <circle cx="48" cy="48" r="45" fill="#fff6dc"/>
  <!-- 木 -->
  <rect x="22" y="44" width="6" height="18" fill="#8b5e3c"/>
  <path d="M25 14 L40 40 H10Z" fill="#5f9e3b"/>
  <path d="M25 24 L42 50 H8Z" fill="#6fae52"/>
  <!-- 切り株 -->
  <path d="M40 60 V78 Q58 86 76 78 V60Z" fill="#a0703f" stroke="#6b4428" stroke-width="3"/>
  <ellipse cx="58" cy="60" rx="18" ry="7" fill="#e2b77a" stroke="#6b4428" stroke-width="3"/>
  <ellipse cx="58" cy="60" rx="9" ry="3.5" fill="none" stroke="#b5835a" stroke-width="2"/>
  <!-- オノ -->
  <path d="M78 22 L58 58" stroke="#8b5e3c" stroke-width="6" stroke-linecap="round"/>
  <path d="M66 18 Q80 8 90 20 L82 32 Q74 22 66 18Z" fill="#b8c4cc" stroke="#5a6a74" stroke-width="2.5"/>
  <path d="M68 19 Q79 12 87 21" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- 木くず -->
  <g fill="#e2b77a"><rect x="36" y="50" width="6" height="3" rx="1.5" transform="rotate(-30 36 50)"/><rect x="80" y="50" width="6" height="3" rx="1.5" transform="rotate(25 80 50)"/></g>
</svg>
