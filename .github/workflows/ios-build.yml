name: iOS Unsigned Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # 1. 確実で安定している Mac標準の wget コマンドでエディタとテンプレートをダウンロード
      - name: Download Godot & Templates
        run: |
          # エディタのダウンロード
          wget -q --show-progress "https://github.com" -O godot.zip
          
          # テンプレートのダウンロード
          wget -q --show-progress "https://github.com" -O templates.zip
          
          # ファイルサイズが正常かチェック（空っぽならここで強制終了させて原因を特定する）
          ls -lh godot.zip templates.zip

      # 2. ファイルを解凍して正しい場所に配置する
      - name: Extract and Setup
        run: |
          unzip -q godot.zip
          unzip -q templates.zip
          mkdir -p "$HOME/Library/Application Support/Godot/templates/4.3.stable"
          mv templates/* "$HOME/Library/Application Support/Godot/templates/4.3.stable/"

      # 3. Xcodeプロジェクトの書き出し
      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/project.xcodeproj

      # 4. Xcodeを使用した未署名IPAのビルド
      - name: Build Unsigned IPA via Xcode
        run: |
          cd build/ios
          
          TARGET_NAME="HamHamCountryFarm"
          
          xcodebuild -project project.xcodeproj \
            -scheme "$TARGET_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          
          mkdir -p Payload
          mv build/Release-iphoneos/*.app Payload/
          zip -r ../../game-unsigned.ipa Payload

      # 5. 完成したIPAファイルを保存
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: game-unsigned.ipa
          retention-days: 7
