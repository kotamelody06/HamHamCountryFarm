name: iOS Unsigned Build

on:
  workflow_dispatch: # ボタンを押して手動でビルドを実行できるようにする

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (M1/M2) 環境の高速なMacを指定
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Godot & Templates
        run: |
          GDVERSION="4.5"
          
          curl -LO https://github.com{GDVERSION}-stable/Godot_v${GDVERSION}-stable_macos.universal.zip
          unzip Godot_v${GDVERSION}-stable_macos.universal.zip
          
          mkdir -p ~/Library/Application\ Support/Godot/templates/${GDVERSION}.stable
          curl -LO https://github.com{GDVERSION}-stable/Godot_v${GDVERSION}-stable_export_templates.tpz
          unzip Godot_v${GDVERSION}-stable_export_templates.tpz
          mv templates/* ~/Library/Application\ Support/Godot/templates/${GDVERSION}.stable/

      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/project.xcodeproj

      - name: Build Unsigned IPA via Xcode
        run: |
          cd build/ios
          
          TARGET_NAME="HamHamCountryFarm"
          
          xcodebuild -project project.xcodeproj \
            -scheme "$TARGET_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          
          mkdir -p Payload
          mv build/Release-iphoneos/*.app Payload/
          zip -r ../../game-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: game-unsigned.ipa
          retention-days: 7 # 7日間保存（無料枠の節約のため）
