name: iOS Unsigned Build

on:
  workflow_dispatch: # ボタンを押して手動でビルドを実行できるようにする

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (M1/M2) 環境の高速なMacを指定
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Godot & Templates
        run: |
          # 1. Godotエディタ（Mac版 4.5）のダウンロードと配置
          curl -LO "https://github.com"
          unzip "Godot_v4.5-stable_macos.universal.zip"
          
          # 2. エクスポートテンプレートのダウンロードと配置
          mkdir -p "$HOME/Library/Application Support/Godot/templates/4.5.stable"
          curl -LO "https://github.com"
          unzip "Godot_v4.5-stable_export_templates.tpz"
          mv templates/* "$HOME/Library/Application Support/Godot/templates/4.5.stable/"

      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/project.xcodeproj

      - name: Build Unsigned IPA via Xcode
        run: |
          cd build/ios
          
          TARGET_NAME="HamHamCountryFarm"
          
          xcodebuild -project project.xcodeproj \
            -scheme "$TARGET_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          
          mkdir -p Payload
          mv build/Release-iphoneos/*.app Payload/
          zip -r ../../game-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: game-unsigned.ipa
          retention-days: 7 # 7日間保存（無料枠の節約のため）
